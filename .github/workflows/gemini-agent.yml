name: Gemini Assistant Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gemini-agent:
    # Triggers whenever you mention @gemini-cli in an issue or PR comment
    if: contains(github.event.comment.body, '@gemini-cli') || contains(github.event.issue.body, '@gemini-cli')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini Agent
        uses: google-github-actions/run-gemini-cli@v0.1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
